ShortDescription: Release candidate builds of the central platform for running CompuTec and custom business apps for SAP Business One.
Description: Release candidate channel of CompuTec AppEngine, published for early testing before a stable release - not intended for production systems. CompuTec AppEngine is a web platform for managing and running business applications for SAP Business One. It serves as the runtime for CompuTec solutions such as WebUp, ProcessForce, and PDC, all available through the built-in app store. Developers can build custom apps using SAPUI5 with C#/.NET, create OData v4/REST APIs, and automate workflows triggered by SAP Business One events. AppEngine provides centralized logging, job scheduling, and Single Sign-On (SSO) support.
